[package]
id = "com.example.myapp"
name = "My Application"
version = "2.4.1"
publisher = "Example Corp"
url = "https://example.com"
support_url = "https://example.com/support"
license_file = "LICENSE.txt"
architecture = "x64"
privileges = "admin"
default_dir = "#{pf}/#{package.name}"
# AppId of the Inno Setup installer this replaces (bare GUID, no braces).
# legacy_inno_app_id = "8A3F2C1D-0B4E-4F6A-9C7D-1E2F3A4B5C6D"
# Run its uninstaller first ("uninstall", the default), or take its install
# over without running it ("adopt"): its Add/Remove Programs entry and unins*
# files go, its other files are left to this install (see [upgrade] prune).
# legacy_inno_mode = "adopt"

[logging]
enabled = true
path = "#{app}/install.log"

[reboot]
policy = "if_needed"
restart_manager = true

[uninstall]
display_icon = "#{app}/myapp.exe"
remove_app_dir = true
extra_dirs = ["#{userappdata}/MyApp"]

[upgrade]
policy = "overwrite"
preserve = ["config/*.toml", "data/**"]
# Refuse to replace an installed version of higher SemVer precedence, before
# changing anything. The installed version is the existing install's, or:
# downgrade = "refuse"
# [upgrade.installed_version]
# registry_key = 'HKLM\SOFTWARE\Classes\CLSID\{...}\InprocServer32'
# from = "parent_dir_name"   # the value names a file in a version directory
#
# After a successful install, remove everything in these directories that
# the install did not record, such as earlier versions' side-by-side
# directories. Files in use are moved aside and deleted at the next restart.
# prune = ["#{app}"]
#
# The uninstaller refuses, changing nothing and exiting 2, while a matching
# registry key exists; `*` matches any one subkey.
# [[uninstall.refuse_while]]
# registry_key = 'HKLM\SOFTWARE\Microsoft\CTF\TIP\{...}\LanguageProfile\*\*'
# message = "Uninstall the keyboards that use it first."

[[components]]
name = "core"
display_name = "Core Application"
required = true
default = true

[[components]]
name = "extras"
display_name = "Extra Features"
required = false
default = false

[[files]]
source = "build/release/**/*"
dest = "#{app}"
overwrite = "if_newer"
component = "core"

[[files]]
source = "extras/*"
dest = "#{app}/extras"
overwrite = "always"
component = "extras"

[[dirs]]
path = "#{app}/logs"
permissions = [{ identity = "Users", access = "modify" }]

[[registry]]
root = "hklm"
key = "Software\\ExampleCorp\\MyApp"
values = [
    { name = "InstallPath", type = "string", data = "#{app}" },
    { name = "Version", type = "string", data = "#{package.version}" },
]
uninstall = "remove_key"

[[shortcuts]]
name = "My Application"
target = "#{app}/myapp.exe"
location = "start_menu"
icon = "#{app}/myapp.exe,0"
working_dir = "#{app}"

[[environment]]
name = "PATH"
value = "#{app}/bin"
scope = "system"
action = "append"

[[services]]
name = "myapp-daemon"
display_name = "MyApp Background Service"
executable = "#{app}/myapp-svc.exe"
start_type = "delayed_auto"
account = "LocalService"
on_install = "start"
on_uninstall = "stop_and_delete"

[[associations]]
extension = ".myf"
prog_id = "MyApp.Document"
description = "MyApp Document"
icon = "#{app}/myapp.exe,1"
command = "\"#{app}/myapp.exe\" \"%1\""

[[prerequisites]]
name = "VC++ 2022 Redistributable"
check = { registry = "HKLM\\SOFTWARE\\Microsoft\\VisualStudio\\14.0\\VC\\Runtimes\\X64", value = "Installed", equals = 1 }
download_url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
installer = "vc_redist.x64.exe"
arguments = "/install /quiet /norestart"
required = true

[[run]]
phase = "after_install"
command = "#{app}/myapp.exe"
arguments = "--init"
wait = true
show = "hidden"

[[fonts]]
source = "assets/CustomFont.ttf"

[[com]]
file = "#{app}/mylib.dll"
action = "regserver"
# host = "x86"   # register a 32-bit DLL with SysWOW64's regsvr32
# arch = "x64"   # only on this architecture (x86, x64, arm64)
